[project]
name = "tokimeki"
version = "0.8.0"
description = "Thin Python wrapper around the tokimeki CLI: submit Python functions as jobs, wait on groups, read results."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokimeki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
